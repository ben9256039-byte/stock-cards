name: 股票晨報字卡
on:
  schedule:
    - cron: "45 23 * * 0-4"   # UTC 23:45 = 台北 07:45（週一～週五）
  workflow_dispatch: {}       # 也可以在 GitHub 網頁手動按「Run」
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python main.py --send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - uses: actions/upload-artifact@v4
        with: { name: cards, path: out/ }
      - name: 字卡存到 cards 分支（方便在 GitHub 上直接看）
        if: always()
        run: |
          cd out
          git init -q -b cards
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "cards $(date +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cards
